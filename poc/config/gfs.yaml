mover:
  name: datamover
  batch_size: 4

directories:
  zarr: gfs.zarr
  cache: cache/gfs
  logs: logs/gfs

source:
  name: gfs_archive
  t0:
    start: 2026-01-22T06
    end: 2026-01-22T12
    freq: 6h

  fhr:
    start: 0
    end: 0
    step: 1

  variables:
        - gh
        - u
        - v
        - w
        - t
        - q
        - sp
        - u10
        - v10
        - t2m
        - t_surface
        - sh2
        - lsm
        - orog

  levels:
        - 100
        - 150
        - 200
        - 250
        - 300
        - 400
        - 500
        - 600
        - 700
        - 850
        - 925
        - 1000

  slices:
    sel:
      latitude: [89.9, -89.9]

target:
  name: anemoi_inference_with_forcings
  sort_channels_by_levels: True
  multistep_input: 2
  forcings:
    - cos_latitude
    - sin_latitude
    - cos_longitude
    - sin_longitude
    - cos_julian_day
    - sin_julian_day
    - cos_local_time
    - sin_local_time
    - insolation

  chunks:
    time: 1
    variable: -1
    ensemble: 1
    cell: -1